name: alehulsh_app
version: 1.0.1+22

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  firebase_messaging: ^15.2.1
  cloud_firestore: ^5.6.0
  geoflutterfire_plus: ^0.0.32
  http: ^1.2.2
  url_launcher: ^6.3.0
  geolocator: ^13.0.0
  audioplayers: ^6.0.0
  record: ^5.1.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.4
  shake: ^3.0.0
  sensors_plus: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#351C63"
  adaptive_icon_foreground: "assets/images/app_logo_foreground.png"

dependency_overrides:
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

